services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prismflow-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prismflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
