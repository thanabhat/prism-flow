# Separate frontend and backend deployments. No secret values belong in this file.
services:
  - type: web
    name: prismflow-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    domains:
      - prismflow-api.thanabh.at
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://prismflow.thanabh.at
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: prismflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    domains:
      - prismflow.thanabh.at
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "26"
      - key: VITE_BACKEND_HTTP_URL
        value: https://prismflow-api.thanabh.at
      - key: VITE_BACKEND_WS_URL
        value: wss://prismflow-api.thanabh.at/ws
